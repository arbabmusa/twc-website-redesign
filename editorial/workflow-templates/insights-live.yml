name: Verify public Insights deployment
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insights-live
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the custom domain serves the expected articles
        run: npm run editorial:verify
